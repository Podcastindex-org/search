source src1
{

	type			= mysql
	sql_host		=
	sql_user		=
	sql_pass		=
	sql_db			=
	sql_port		= 3306	# optional, default is 3306
	sql_query		= \
		SELECT nfitems.id AS id,\
                       nfitems.title AS episode_title,\
                       nfitems.description AS episode_description,\
                       newsfeeds.itunes_author AS feed_author,\
                       newsfeeds.itunes_owner_name AS feed_owner \
                  FROM nfitems \
            INNER JOIN newsfeeds ON nfitems.feedid = newsfeeds.id \
                 WHERE newsfeeds.dead = 0 \
                   AND newsfeeds.lasthttpstatus = 200 \
                   AND newsfeeds.item_count >= 8
	# Main-query document ids must be unique. Joined fields support the
	# one-to-many rows needed to index every credited person for an episode.
	sql_joined_field	= person_name from query; \
		SELECT nfitem_persons.itemid, nfitem_persons.name \
		  FROM nfitem_persons \
	INNER JOIN nfitems ON nfitem_persons.itemid = nfitems.id \
	INNER JOIN newsfeeds ON nfitems.feedid = newsfeeds.id \
		 WHERE newsfeeds.dead = 0 \
		   AND newsfeeds.lasthttpstatus = 200 \
		   AND newsfeeds.item_count >= 8 \
	      ORDER BY nfitem_persons.itemid ASC, nfitem_persons.name ASC
	sql_range_step		= 5000
	sql_attr_bigint		= id
	sql_ranged_throttle	= 300
}
source src1throttled : src1
{
	sql_ranged_throttle	= 300
}

index person1
{
	source			= src1
	path			= /var/lib/sphinxsearch/data/person1
	docinfo			= extern
	dict			= keywords
	mlock			= 0
	morphology		= none

        charset_table = 0..9, A..Z->a..z, a..z, U+C0->a, U+C1->a, U+C2->a, U+C3->a, U+C4->a, U+C5->a, U+C6->a, U+C7->c,U+E7->c, U+C8->e, U+C9->e, U+CA->e, U+CB->e, U+CC->i, U+CD->i, U+CE->i, U+CF->i, U+D0->d, U+D1->n, U+D2->o, U+D3->o,  U+D4->o, U+D5->o, U+D6->o, U+D8->o, U+D9->u, U+DA->u, U+DB->u, U+DC->u, U+DD->y, U+DE->t, U+DF->s, U+E0->a, U+E1->a, U+E2->a, U+E3->a, U+E4->a, U+E5->a, U+E6->a, U+E7->c,U+E7->c, U+E8->e, U+E9->e, U+EA->e, U+EB->e, U+EC->i, U+ED->i, U+EE->i, U+EF->i, U+F0->d, U+F1->n, U+F2->o, U+F3->o, U+F4->o, U+F5->o, U+F6->o, U+F8->o, U+F9->u, U+FA->u, U+FB->u, U+FC->u, U+FD->y, U+FE->t, U+FF->s, U+142->l, U+105->a,U+107->c,U+119->e,U+142->l,U+144->n,U+0f3->o,U+15b->s,U+17a->z,U+17c->z
	stopwords		= /var/lib/sphinxsearch/data/stopwords.txt
	min_word_len		= 3
	min_prefix_len		= 0
	min_infix_len		= 0
	html_strip		= 1
	html_remove_elements	= style, script
}

index dist1
{
	type			= distributed
	local			= person1
	agent			= localhost:9313:remote1
	agent			= localhost:9314:remote2,remote3
	agent_connect_timeout	= 1000
	agent_query_timeout		= 3000
}

index rt
{
	type			= rt
	path			= /var/lib/sphinxsearch/data/rt
	rt_field		= title
	rt_field		= content
	rt_attr_uint		= gid
}

indexer
{
	mem_limit		= 1024M
}

searchd
{
	listen			= 9312
	listen			= 9306:mysql41
	log			= /var/log/sphinxsearch/searchd.log
	query_log		= /var/log/sphinxsearch/query.log
	read_timeout		= 5
	client_timeout		= 300
	max_children		= 30
	persistent_connections_limit	= 30
	pid_file		= /var/run/sphinxsearch/searchd.pid
	seamless_rotate		= 1
	preopen_indexes		= 1
	unlink_old		= 1
	mva_updates_pool	= 1M
	max_packet_size		= 8M
	max_filters		= 256
	max_filter_values	= 4096
	max_batch_queries	= 32
	workers			= threads # for RT to work
}

common
{

}
